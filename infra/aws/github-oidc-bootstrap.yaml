AWSTemplateFormatVersion: '2010-09-09'
Description: >
  One-time AWS bootstrap for Product Identity GitHub Actions. Creates or reuses
  the GitHub OIDC provider and installs the least-privilege deployment roles.

Parameters:
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ''
    Description: >
      Existing token.actions.githubusercontent.com OIDC provider ARN. Leave
      empty to create the provider in this AWS account.

  GitHubSubject:
    Type: String
    Default: 'repo:Trigenys@328842096/product-identity@1387591791:ref:refs/heads/main'
    Description: Immutable GitHub Actions OIDC subject allowed to assume the deploy role.

  DeployRoleName:
    Type: String
    Default: product-identity-github-deploy

  CloudFormationExecutionRoleName:
    Type: String
    Default: product-identity-cloudformation-execution

  ApplicationStackName:
    Type: String
    Default: product-identity-production

  EcrPublicRepositoryName:
    Type: String
    Default: product-identity-api

Conditions:
  UseExistingGitHubOidcProvider: !Not [!Equals [!Ref ExistingGitHubOidcProviderArn, '']]
  CreateGitHubOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, '']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Project
          Value: product-identity
        - Key: ManagedBy
          Value: cloudformation

  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref CloudFormationExecutionRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - cloudformation.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: ProductIdentityInfrastructure
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Ec2Infrastructure
                Effect: Allow
                Action:
                  - ec2:AssociateRouteTable
                  - ec2:AssociateVpcCidrBlock
                  - ec2:AttachInternetGateway
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:CreateInternetGateway
                  - ec2:CreateRoute
                  - ec2:CreateRouteTable
                  - ec2:CreateSecurityGroup
                  - ec2:CreateSubnet
                  - ec2:CreateTags
                  - ec2:CreateVpc
                  - ec2:DeleteInternetGateway
                  - ec2:DeleteRoute
                  - ec2:DeleteRouteTable
                  - ec2:DeleteSecurityGroup
                  - ec2:DeleteSubnet
                  - ec2:DeleteTags
                  - ec2:DeleteVpc
                  - ec2:DescribeAccountAttributes
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeImages
                  - ec2:DescribeInstanceAttribute
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceStatus
                  - ec2:DescribeInternetGateways
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeRouteTables
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeTags
                  - ec2:DescribeVolumes
                  - ec2:DescribeVpcAttribute
                  - ec2:DescribeVpcs
                  - ec2:DetachInternetGateway
                  - ec2:DisassociateRouteTable
                  - ec2:DisassociateVpcCidrBlock
                  - ec2:ModifyInstanceAttribute
                  - ec2:ModifyNetworkInterfaceAttribute
                  - ec2:ModifySubnetAttribute
                  - ec2:ModifyVpcAttribute
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:RunInstances
                  - ec2:TerminateInstances
                Resource: '*'

              - Sid: ManageProductIdentityIam
                Effect: Allow
                Action:
                  - iam:AddRoleToInstanceProfile
                  - iam:AttachRolePolicy
                  - iam:CreateInstanceProfile
                  - iam:CreateRole
                  - iam:DeleteInstanceProfile
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:GetInstanceProfile
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:PassRole
                  - iam:PutRolePolicy
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:TagInstanceProfile
                  - iam:TagRole
                  - iam:UntagInstanceProfile
                  - iam:UntagRole
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/product-identity-*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/product-identity-*'

              - Sid: ResolveAmazonLinuxAmi
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:*::parameter/aws/service/ami-amazon-linux-latest/*'
      Tags:
        - Key: Project
          Value: product-identity
        - Key: ManagedBy
          Value: cloudformation

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref DeployRoleName
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - UseExistingGitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
                - !Ref GitHubOidcProvider
            Action:
              - sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref GitHubSubject
      Policies:
        - PolicyName: ProductIdentityDeployment
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DeployApplicationStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplateSummary
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/${ApplicationStackName}/*'

              - Sid: PassCloudFormationExecutionRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com

              - Sid: ManagePublicImageRepository
                Effect: Allow
                Action:
                  - ecr-public:CreateRepository
                  - ecr-public:DescribeRepositories
                  - ecr-public:GetAuthorizationToken
                Resource: '*'

              - Sid: PushPublicImage
                Effect: Allow
                Action:
                  - ecr-public:BatchCheckLayerAvailability
                  - ecr-public:CompleteLayerUpload
                  - ecr-public:InitiateLayerUpload
                  - ecr-public:PutImage
                  - ecr-public:UploadLayerPart
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ecr-public::${AWS::AccountId}:repository/${EcrPublicRepositoryName}'

              - Sid: GetEcrServiceBearerToken
                Effect: Allow
                Action:
                  - sts:GetServiceBearerToken
                Resource: '*'
                Condition:
                  StringEquals:
                    sts:AWSServiceName: ecr-public.amazonaws.com

              - Sid: SendDeploymentCommand
                Effect: Allow
                Action:
                  - ssm:SendCommand
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:*::document/AWS-RunShellScript'

              - Sid: SendDeploymentCommandToProductIdentity
                Effect: Allow
                Action:
                  - ssm:SendCommand
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:instance/*'
                Condition:
                  StringEquals:
                    ssm:resourceTag/Project: product-identity

              - Sid: ReadDeploymentCommand
                Effect: Allow
                Action:
                  - ssm:DescribeInstanceInformation
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                  - ssm:ListCommands
                Resource: '*'
      Tags:
        - Key: Project
          Value: product-identity
        - Key: ManagedBy
          Value: cloudformation

Outputs:
  DeployRoleArn:
    Description: Store this ARN in the GitHub repository variable PRODUCT_IDENTITY_AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt GitHubDeployRole.Arn

  CloudFormationExecutionRoleArn:
    Description: Service role used by the application CloudFormation deployment.
    Value: !GetAtt CloudFormationExecutionRole.Arn

  GitHubOidcSubject:
    Description: Immutable GitHub OIDC subject trusted by the deployment role.
    Value: !Ref GitHubSubject

  GitHubOidcProviderArn:
    Description: GitHub Actions OIDC provider used by the deployment role.
    Value: !If
      - UseExistingGitHubOidcProvider
      - !Ref ExistingGitHubOidcProviderArn
      - !Ref GitHubOidcProvider
