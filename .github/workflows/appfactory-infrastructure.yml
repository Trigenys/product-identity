name: AppFactory Infrastructure

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "shopify.app.production.toml.template"
      - ".github/workflows/appfactory-infrastructure.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: product-identity-infrastructure
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      APPFACTORY_URL: https://appfactory-api.lawrynnjennifer.workers.dev
      OIDC_AUDIENCE: appfactory-api
      SHOPIFY_CLIENT_ID: ${{ vars.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      SHOPIFY_PREVIOUS_CLIENT_SECRET: ${{ secrets.SHOPIFY_PREVIOUS_CLIENT_SECRET }}
      SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
      PRODUCT_IDENTITY_AUTH_JWT_KEY: ${{ secrets.PRODUCT_IDENTITY_AUTH_JWT_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate product credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$SHOPIFY_CLIENT_ID" ]] || missing+=("SHOPIFY_CLIENT_ID variable")
          [[ -n "$SHOPIFY_CLIENT_SECRET" ]] || missing+=("SHOPIFY_CLIENT_SECRET secret")
          [[ -n "$SHOPIFY_APP_AUTOMATION_TOKEN" ]] || missing+=("SHOPIFY_APP_AUTOMATION_TOKEN secret")
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          token="$(jq -r '.value // empty' <<<"$response")"
          if [[ -z "$token" ]]; then
            echo "::error::GitHub did not return an OIDC token."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Provision Worker through AppFactory
        id: appfactory
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail

          request_file="$RUNNER_TEMP/product-identity-infrastructure.json"
          response_file="$RUNNER_TEMP/product-identity-infrastructure-response.json"

          python - <<'PY' > "$request_file"
          import json
          import os

          runtime = {
              "PRODUCT_IDENTITY_RUNTIME": "cloudflare-worker",
              "PRODUCT_IDENTITY_ENVIRONMENT": "production",
              "PRODUCT_IDENTITY_PUBLIC_BASE_URL": "__WEB_URL__",
              "PRODUCT_IDENTITY_CORS_ORIGINS": "[\"__WEB_URL__\"]",
              "PRODUCT_IDENTITY_SHOPIFY_CLIENT_ID": os.environ["SHOPIFY_CLIENT_ID"],
              "PRODUCT_IDENTITY_SHOPIFY_CLIENT_SECRET": os.environ["SHOPIFY_CLIENT_SECRET"],
              "PRODUCT_IDENTITY_SHOPIFY_API_VERSION": "2026-07",
              "PRODUCT_IDENTITY_SHOPIFY_SCOPES": "read_products,read_orders",
              "PRODUCT_IDENTITY_SHOPIFY_OAUTH_CALLBACK_URL": "__WORKER_URL__/v1/integrations/shopify/oauth/callback",
              "PRODUCT_IDENTITY_SHOPIFY_AFTER_INSTALL_URL": "__WEB_URL__/app",
          }

          previous_secret = os.environ.get("SHOPIFY_PREVIOUS_CLIENT_SECRET", "").strip()
          if previous_secret:
              runtime["PRODUCT_IDENTITY_SHOPIFY_PREVIOUS_CLIENT_SECRET"] = previous_secret

          auth_key = os.environ.get("PRODUCT_IDENTITY_AUTH_JWT_KEY", "").strip()
          if auth_key:
              runtime["PRODUCT_IDENTITY_AUTH_JWT_KEY"] = auth_key

          print(json.dumps({
              "repository": "Trigenys/product-identity",
              "workerName": "product-identity-api",
              "rootDirectory": "/backend",
              "buildCommand": "bash scripts/package_worker.sh dry-run wrangler.production.toml ../worker-dist-production",
              "deployCommand": "bash scripts/package_worker.sh deploy wrangler.production.toml",
              "pagesProject": "product-identity",
              "runtimeSecrets": runtime,
              "generatedSecrets": [
                  {
                      "name": "PRODUCT_IDENTITY_SHOPIFY_TOKEN_ENCRYPTION_KEY",
                      "kind": "fernet"
                  },
                  {
                      "name": "PRODUCT_IDENTITY_VERIFICATION_TOKEN_SECRET",
                      "kind": "token"
                  },
                  {
                      "name": "PRODUCT_IDENTITY_PROOF_UPLOAD_SECRET",
                      "kind": "token"
                  }
              ]
          }))
          PY

          http_code="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request POST \
              --header "Authorization: Bearer $OIDC_TOKEN" \
              --header "Content-Type: application/json" \
              --data-binary "@$request_file" \
              "$APPFACTORY_URL/infrastructure/worker"
          )"

          rm -f "$request_file"

          if [[ "$http_code" != "200" ]]; then
            echo "::error::AppFactory infrastructure provisioning returned HTTP $http_code."
            jq '{error, message, requiredPermissions}' "$response_file" || true
            exit 1
          fi

          api_url="$(jq -r '.infrastructure.worker.url // empty' "$response_file")"
          web_url="$(jq -r '.infrastructure.pages.url // empty' "$response_file")"
          build_uuid="$(jq -r '.infrastructure.builds.buildUuid // empty' "$response_file")"

          if [[ -z "$api_url" ]]; then
            echo "::error::AppFactory did not return the Worker URL."
            exit 1
          fi

          echo "api_url=$api_url" >> "$GITHUB_OUTPUT"
          echo "web_url=$web_url" >> "$GITHUB_OUTPUT"
          echo "build_uuid=$build_uuid" >> "$GITHUB_OUTPUT"

          {
            echo "## AppFactory infrastructure"
            echo
            echo "- Worker: $api_url"
            [[ -n "$web_url" ]] && echo "- Web: $web_url"
            [[ -n "$build_uuid" ]] && echo "- Cloudflare build: $build_uuid"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for Worker deployment
        env:
          API_URL: ${{ steps.appfactory.outputs.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..36}; do
            body="$(curl --silent --show-error --max-time 10 "$API_URL/health" || true)"
            if jq -e '
              (.runtime == "cloudflare-worker") and
              (.status == "ok" or .status == "degraded")
            ' >/dev/null 2>&1 <<<"$body"; then
              echo "Worker is online at $API_URL"
              echo "$body" | jq .
              exit 0
            fi
            sleep 5
          done
          echo "::error::Worker did not become healthy or explicitly degraded within 3 minutes."
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: Render Shopify app configuration
        env:
          SHOPIFY_APP_URL: ${{ steps.appfactory.outputs.api_url }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          template = Path("shopify.app.production.toml.template").read_text()
          api_url = os.environ["SHOPIFY_APP_URL"].rstrip("/")
          rendered = (
              template
              .replace("__SHOPIFY_CLIENT_ID__", os.environ["SHOPIFY_CLIENT_ID"])
              .replace("__SHOPIFY_APP_URL__", api_url)
          )
          Path("shopify.app.production.toml").write_text(rendered)
          PY

      - name: Deploy Shopify app configuration
        env:
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          shopify app deploy \
            --config production \
            --allow-updates \
            --source-control-url "$COMMIT_URL"

      - name: Deployment summary
        env:
          API_URL: ${{ steps.appfactory.outputs.api_url }}
          WEB_URL: ${{ steps.appfactory.outputs.web_url }}
        run: |
          {
            echo
            echo "## Product Identity release boundary"
            echo
            echo "- Cloudflare credentials: owned by AppFactory, not this repository"
            echo "- API: $API_URL"
            echo "- Web: ${WEB_URL:-Cloudflare Pages}"
            echo "- Shopify configuration: deployed"
            echo "- Database: intentionally fail-closed until PostgreSQL/Hyperdrive is bound"
          } >> "$GITHUB_STEP_SUMMARY"
