name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend toolchain
        run: python -m pip install --upgrade pip uv

      - name: Sync backend development environment
        run: uv sync --group dev

      - name: Run backend tests
        run: uv run pytest

      - name: Migration smoke test
        run: uv run alembic upgrade head


  worker-bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker toolchain
        run: |
          python -m pip install --upgrade pip uv
          npm install -g wrangler@latest

      - name: Compile production Worker from runtime-only artifact
        run: |
          bash scripts/package_worker.sh \
            dry-run \
            wrangler.production.toml \
            ../worker-dist-production 2>&1 | tee "$RUNNER_TEMP/worker-bundle.log"

      - name: Enforce Worker bundle budget
        run: |
          python scripts/check_worker_bundle_size.py \
            "$RUNNER_TEMP/worker-bundle.log" \
            --warn-mib 50 \
            --max-mib 60


  iac:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install CloudFormation linter
        run: python -m pip install "cfn-lint>=1,<2"

      - name: Validate AWS CloudFormation
        run: cfn-lint infra/aws/backend-ec2.yaml

      - name: Guard free-tier-first architecture
        shell: bash
        run: |
          set -euo pipefail
          template="infra/aws/backend-ec2.yaml"

          if grep -Eq 'AWS::EC2::NatGateway|AWS::EC2::EIP|AWS::ElasticLoadBalancing|AWS::ElasticLoadBalancingV2|AWS::RDS::|AWS::SecretsManager::' "$template"; then
            echo "::error::A fixed-cost managed resource was added to the free-tier-first stack."
            exit 1
          fi

          if grep -Eq 'FromPort:[[:space:]]*22|ToPort:[[:space:]]*22' "$template"; then
            echo "::error::SSH must stay closed; use AWS Systems Manager."
            exit 1
          fi
