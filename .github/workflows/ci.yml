name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  impact:
    name: impact
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.impact.outputs.frontend }}
      backend: ${{ steps.impact.outputs.backend }}
      worker: ${{ steps.impact.outputs.worker }}
      iac: ${{ steps.impact.outputs.iac }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect impacted surfaces
        id: impact
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          frontend=false
          backend=false
          worker=false
          iac=false

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BASE_SHA"
            head="$CURRENT_SHA"
          fi

          if [[ -z "${base:-}" || "$base" =~ ^0+$ ]]; then
            mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$head")
          else
            mapfile -t changed < <(git diff --name-only "$base" "$head")
          fi

          printf 'Changed files:\n'
          printf ' - %s\n' "${changed[@]}"

          for path in "${changed[@]}"; do
            case "$path" in
              .github/workflows/ci.yml)
                frontend=true
                backend=true
                worker=true
                iac=true
                ;;

              src/*|index.html|package.json|tsconfig.json|tsconfig.app.json|tsconfig.node.json|vite.config.ts)
                frontend=true
                ;;

              backend/app/*|backend/alembic/*|backend/pyproject.toml|backend/tests/*|backend/alembic.ini)
                backend=true
                ;;

              backend/app/*|backend/worker.py|backend/pyproject.toml|backend/scripts/package_worker.sh|backend/scripts/check_worker_bundle_size.py|backend/wrangler.toml|backend/wrangler.production.toml)
                worker=true
                ;;

              infra/aws/*)
                iac=true
                ;;
            esac
          done

          {
            echo "frontend=$frontend"
            echo "backend=$backend"
            echo "worker=$worker"
            echo "iac=$iac"
          } | tee -a "$GITHUB_OUTPUT"

  frontend:
    needs: impact
    if: needs.impact.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  backend:
    needs: impact
    if: needs.impact.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend toolchain
        run: python -m pip install --upgrade pip uv

      - name: Sync backend development environment
        run: uv sync --group dev

      - name: Run backend tests
        run: uv run pytest

      - name: Migration smoke test
        run: uv run alembic upgrade head

  worker-bundle:
    needs: impact
    if: needs.impact.outputs.worker == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker toolchain
        run: |
          python -m pip install --upgrade pip uv
          npm install -g wrangler@latest

      - name: Compile production Worker from runtime-only artifact
        run: |
          bash scripts/package_worker.sh \
            dry-run \
            wrangler.production.toml \
            ../worker-dist-production 2>&1 | tee "$RUNNER_TEMP/worker-bundle.log"

      - name: Enforce Worker bundle budget
        run: |
          python scripts/check_worker_bundle_size.py \
            "$RUNNER_TEMP/worker-bundle.log" \
            --warn-mib 50 \
            --max-mib 60

  iac:
    needs: impact
    if: needs.impact.outputs.iac == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install CloudFormation linter
        run: python -m pip install "cfn-lint>=1,<2"

      - name: Validate AWS CloudFormation
        run: cfn-lint infra/aws/backend-ec2.yaml

      - name: Guard free-tier-first architecture
        shell: bash
        run: |
          set -euo pipefail
          template="infra/aws/backend-ec2.yaml"

          if grep -Eq 'AWS::EC2::NatGateway|AWS::EC2::EIP|AWS::ElasticLoadBalancing|AWS::ElasticLoadBalancingV2|AWS::RDS::|AWS::SecretsManager::' "$template"; then
            echo "::error::A fixed-cost managed resource was added to the free-tier-first stack."
            exit 1
          fi

          if grep -Eq 'FromPort:[[:space:]]*22|ToPort:[[:space:]]*22' "$template"; then
            echo "::error::SSH must stay closed; use AWS Systems Manager."
            exit 1
          fi
