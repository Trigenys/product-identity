name: Shopify App Config

on:
  push:
    branches: [main]
    paths:
      - "shopify.app.production.toml.template"
      - ".github/workflows/shopify-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.SHOPIFY_CLIENT_ID != '' && vars.SHOPIFY_APP_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: Render Shopify production configuration
        env:
          SHOPIFY_CLIENT_ID: ${{ vars.SHOPIFY_CLIENT_ID }}
          SHOPIFY_APP_URL: ${{ vars.SHOPIFY_APP_URL }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          template = Path("shopify.app.production.toml.template").read_text()
          app_url = os.environ["SHOPIFY_APP_URL"].rstrip("/")
          rendered = (
              template
              .replace("__SHOPIFY_CLIENT_ID__", os.environ["SHOPIFY_CLIENT_ID"])
              .replace("__SHOPIFY_APP_URL__", app_url)
          )
          Path("shopify.app.production.toml").write_text(rendered)
          PY

      - name: Deploy Shopify app configuration
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: shopify app deploy --config production --allow-updates --source-control-url "$COMMIT_URL"
